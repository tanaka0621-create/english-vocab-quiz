<title>社会人英語道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
:root{
  --paper:#eef2f1;--card:#ffffff;--ink:#1d2b3a;--muted:#5b6977;--line:#d6dde1;
  --ai:#1a5f9e;--ai-soft:#e0eaf7;--ok:#1a7a4a;--ok-soft:#e3f5eb;
  --red:#c0392b;--red-soft:#fbe9e5;
  --bar:#c9d3dc;--gold:#c8911a;--gold-soft:#fbf1d9;--gold-ink:#8a5f00;
  --shadow:0 1px 3px rgba(29,43,58,.08),0 4px 14px rgba(29,43,58,.06);
  --font:"Noto Sans JP",system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#131920;--card:#1c242e;--ink:#e7ecef;--muted:#9ba7b3;--line:#2d3945;
  --ai:#6fa8dc;--ai-soft:#1e3550;--ok:#4caf82;--ok-soft:#1b3a2a;
  --red:#e05a4a;--red-soft:#3a2420;
  --bar:#34414e;--gold:#d9a634;--gold-soft:#3a3020;--gold-ink:#f0c35a;
  --shadow:0 1px 3px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#131920;--card:#1c242e;--ink:#e7ecef;--muted:#9ba7b3;--line:#2d3945;
  --ai:#6fa8dc;--ai-soft:#1e3550;--ok:#4caf82;--ok-soft:#1b3a2a;
  --red:#e05a4a;--red-soft:#3a2420;
  --bar:#34414e;--gold:#d9a634;--gold-soft:#3a3020;--gold-ink:#f0c35a;
  --shadow:0 1px 3px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:580px;margin:0 auto;padding:12px 16px 100px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:8px 0 16px}
.brand{font-size:22px;font-weight:700}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:400;letter-spacing:.06em}
.streak{font-size:13px;color:var(--muted);text-align:right}
.streak b{font-size:22px;color:var(--red)}
.start{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.bigbtn{border:0;border-radius:14px;padding:14px 12px;text-align:left;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-height:78px;width:100%}
.bigbtn b{font-size:17px}
.bigbtn span{font-size:12px;color:var(--muted)}
.bigbtn.primary{background:var(--ai);color:#fff}
.bigbtn.primary span{color:rgba(255,255,255,.85)}
.bigbtn:disabled{opacity:.5;cursor:default}
.toggle-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toggle-btn{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.toggle-btn.on{background:var(--ai);border-color:var(--ai);color:#fff}
.sec-title{font-size:13px;color:var(--muted);letter-spacing:.1em;margin:4px 0 8px}
.cats{display:flex;flex-direction:column;gap:8px}
.cat{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;width:100%}
.cat .nm{font-weight:700;font-size:17px}
.cat .ds{font-size:12px;color:var(--muted);grid-column:1}
.cat .due{grid-row:1/3;grid-column:2;align-self:center;font-size:12px;color:var(--muted);text-align:right}
.cat .due b{display:block;font-size:20px;color:var(--red)}
.cat .due b.zero{color:var(--muted)}
.meter{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:4px}
.meter .track{flex:1;height:6px;background:var(--bar);border-radius:3px;overflow:hidden;display:flex}
.meter .fill{height:100%;background:var(--ai)}
.meter .fill2{height:100%;background:var(--ai);opacity:.3}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav-in{display:flex;max-width:580px;width:100%}
.nav button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .ic{font-size:20px;line-height:1.1}
.nav button[aria-current="page"]{color:var(--ai)}
.qtop{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.qtop .quit{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-size:14px}
.qtop .prog{flex:1;height:8px;background:var(--bar);border-radius:4px;overflow:hidden}
.qtop .prog div{height:100%;background:var(--ai);transition:width .25s}
.qtop .pc{font-size:14px;color:var(--muted);min-width:3.5em;text-align:right}
.qcard{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px 18px 20px;border:1px solid var(--line);position:relative}
.qbadge{display:inline-flex;gap:6px;align-items:center;margin-bottom:8px}
.qbadge .cat-tag{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--ai-soft);color:var(--ai);font-weight:700}
.qbadge .dir-tag{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold-ink);font-weight:700}
.qins{font-size:14px;color:var(--muted);margin:0 0 10px}
.qword{font-size:32px;font-weight:700;line-height:1.4;word-break:break-all;margin-bottom:4px}
.qword.en{font-size:26px;letter-spacing:.02em}
.qsub{font-size:14px;color:var(--muted)}
.mark{position:absolute;top:8px;right:14px;font-size:60px;line-height:1;font-weight:700;pointer-events:none;animation:pop .2s ease-out}
.mark.ok{color:var(--ok)}
.mark.ng{color:var(--red)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.answers{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;text-align:left;font-size:18px;font-weight:600;line-height:1.4;width:100%}
.opt.en-opt{font-size:16px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{opacity:.5;text-decoration:line-through}
.reveal{margin-top:14px;padding:14px;border-radius:12px;background:var(--ai-soft)}
.reveal .pair{font-size:18px;font-weight:700;margin-top:4px}
.reveal .ex{font-size:14px;color:var(--muted);margin-top:4px}
.speak-btn{border:0;background:none;font-size:22px;cursor:pointer;padding:4px 8px;border-radius:8px;vertical-align:middle;transition:background .15s}
.speak-btn:hover{background:var(--line)}
.speak-btn.playing{animation:pulse .5s infinite alternate}
@keyframes pulse{from{opacity:.4}to{opacity:1}}
.tts-hint{font-size:12px;color:var(--muted);margin-top:6px}
.example{font-size:14px;font-style:italic;color:var(--ink);margin-top:8px;padding-top:8px;border-top:1px solid var(--line);line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{border:0;border-radius:12px;padding:14px;font-weight:700;font-size:17px;background:var(--ai);color:#fff;width:100%}
.act.red{background:var(--red)}
.act.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.tip{font-size:13px;color:var(--muted);text-align:center;margin:8px 0 0}
.score{text-align:center;padding:14px 0}
.score .big{font-size:56px;font-weight:700;color:var(--ai);line-height:1.1}
.score .big small{font-size:20px;color:var(--ink)}
.score .msg{color:var(--muted);margin-top:6px}
.list{display:flex;flex-direction:column;gap:8px;margin:10px 0 18px}
.li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.li .q{font-size:13px;color:var(--muted)}
.li .a{font-size:18px;font-weight:700}
.li .pair{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--muted)}
.setting{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.setting label{font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.note{font-size:13px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;font-size:14px;margin-bottom:18px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:12px;color:var(--muted);font-weight:500}
.note-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;background:var(--card);border-radius:12px;border:1px dashed var(--line)}
</style>

<div class="wrap">
  <section id="home">
    <header class="top">
      <div class="brand"><small>社会人英語</small>英語道場</div>
      <div class="streak">連続<br><b id="streak">0</b> 日</div>
    </header>
    <div class="sec-title">出題モード</div>
    <div class="toggle-row" id="modeToggle">
      <button class="toggle-btn on" data-mode="mix">🔀 ミックス</button>
      <button class="toggle-btn" data-mode="jpToEn">🇯🇵→🇬🇧 日→英</button>
      <button class="toggle-btn" data-mode="enToJp">🇬🇧→🇯🇵 英→日</button>
    </div>
    <div class="sec-title">問題数</div>
    <div class="toggle-row" id="countToggle">
      <button class="toggle-btn" data-count="5">5問 (約2分)</button>
      <button class="toggle-btn on" data-count="10">10問 (約5分)</button>
      <button class="toggle-btn" data-count="20">20問 (約10分)</button>
    </div>
    <div class="start">
      <button class="bigbtn primary" id="btnReview"><b>📚 今日の復習</b><span id="reviewInfo">0問</span></button>
      <button class="bigbtn" id="btnMix"><b>🎲 おまかせ</b><span>全カテゴリから</span></button>
    </div>
    <div class="sec-title">カテゴリをえらぶ</div>
    <div class="cats" id="cats"></div>
  </section>

  <section id="quiz" hidden>
    <div class="qtop">
      <button class="quit" id="quit">やめる</button>
      <div class="prog"><div id="progBar"></div></div>
      <div class="pc" id="progTxt"></div>
    </div>
    <div class="qcard" id="qcard"></div>
  </section>

  <section id="result" hidden>
    <div class="score">
      <div class="muted" id="resCat"></div>
      <div class="big" id="resScore"></div>
      <div class="msg" id="resMsg"></div>
    </div>
    <div class="stack">
      <button class="act red" id="resRetry">まちがえた問題をもう一度</button>
      <button class="act ghost" id="resHome">ホームへもどる</button>
    </div>
    <div class="sec-title" style="margin-top:20px" id="resListTitle">まちがえた問題</div>
    <div class="list" id="resList"></div>
  </section>

  <section id="note" hidden>
    <header class="top"><div class="brand"><small>何度もまちがえた順</small>まちがいノート</div></header>
    <button class="act red" id="noteStart" style="margin-bottom:12px">この中からとく</button>
    <div class="note-list" id="noteList"></div>
  </section>

  <section id="rec" hidden>
    <header class="top"><div class="brand"><small>がんばりの記録</small>記録と設定</div></header>
    <div class="stats">
      <div class="stat"><b id="stTotal">0</b><span>といた数</span></div>
      <div class="stat"><b id="stRate">-</b><span>正解率</span></div>
      <div class="stat"><b id="stDays">0</b><span>学習した日</span></div>
    </div>
    <div style="overflow-x:auto"><table class="tbl" id="recTbl"></table></div>
    <div class="setting">
      <label>画面の色</label>
      <div class="chips" id="themeChips">
        <button class="chip" data-t="light">明るい</button>
        <button class="chip" data-t="dark">暗い</button>
        <button class="chip" data-t="auto">端末に合わせる</button>
      </div>
    </div>
    <div class="setting">
      <label>記録をすべて消す</label>
      <button class="act ghost" id="resetBtn">記録をリセットする</button>
      <div id="resetConfirm" hidden class="row2">
        <button class="act red" id="resetYes">本当に消す</button>
        <button class="act ghost" id="resetNo">やめる</button>
      </div>
    </div>
  </section>
</div>

<nav class="nav" id="nav">
  <div class="nav-in">
    <button data-go="home" aria-current="page"><span class="ic">🏠</span>ホーム</button>
    <button data-go="note"><span class="ic">✕</span>まちがい</button>
    <button data-go="rec"><span class="ic">📊</span>記録</button>
  </div>
</nav>

let currentMode='mix', currentCount=10;
const KEY='eigodojo-v1';
let S={items:{},days:[],total:0,correct:0};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

function dayNum(d){d=d||new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);}
const TODAY=()=>dayNum();
const INTERVAL=[0,1,3,7,14,30];
const st=id=>S.items[id];
const isDue=id=>{const x=st(id);return x&&x.due<=TODAY();};
function record(id,ok){
  const isNew=!S.items[id];
  const x=S.items[id]||{box:0,due:0,wrong:0,right:0};
  const onTime=isNew||x.due<=TODAY();
  if(ok){x.right++;if(onTime){x.box=Math.min(x.box+1,5);x.due=TODAY()+INTERVAL[x.box];}}
  else{x.box=1;x.wrong++;x.due=TODAY()+INTERVAL[1];}
  x.last=TODAY();x.lastOk=ok;
  S.items[id]=x;S.total++;if(ok)S.correct++;
  if(!S.days.includes(TODAY()))S.days.push(TODAY());
  save();
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=(arr,n,not=[])=>shuffle(arr.filter(v=>!not.includes(v))).slice(0,n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);

// ===== テキスト読み上げ (TTS) =====
let ttsBtn=null;
function speak(text, btn){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang='en-US'; utt.rate=0.85; utt.pitch=1;
  if(btn){ btn.classList.add('playing'); utt.onend=()=>btn.classList.remove('playing'); }
  window.speechSynthesis.speak(utt);
}
function makeSpeakBtn(enText){
  const btn=document.createElement('button');
  btn.className='speak-btn'; btn.title='英語を読み上げる';
  btn.textContent='🔊'; btn.type='button';
  btn.onclick=e=>{e.stopPropagation();speak(enText,btn);};
  return btn;
}

function build(it,forceDir){
  const pool=ITEMS.filter(p=>p.cat===it.cat&&p.id!==it.id);
  let dir=forceDir||(currentMode==='mix'?(Math.random()<.5?'jpToEn':'enToJp'):currentMode);
  if(dir==='jpToEn'){
    const opts=shuffle([it.en,...pick(pool.map(p=>p.en),3,[it.en])]);
    return{it,dir,question:it.jp,answer:it.en,opts,isEnOpts:true};
  }else{
    const opts=shuffle([it.jp,...pick(pool.map(p=>p.jp),3,[it.jp])]);
    return{it,dir,question:it.en,answer:it.jp,opts,isEnOpts:false};
  }
}

let SES=null;
function makeSet(pool,n){
  const due=shuffle(pool.filter(it=>isDue(it.id))).sort((a,b)=>(st(a.id)?.due||0)-(st(b.id)?.due||0));
  const fresh=shuffle(pool.filter(it=>!st(it.id)));
  let set=[...due,...fresh].slice(0,n);
  if(set.length<n){const rest=pool.filter(it=>!set.includes(it)).sort((a,b)=>((st(a.id)?.box)||0)-((st(b.id)?.box)||0));set=set.concat(rest.slice(0,n-set.length));}
  return shuffle(set);
}
function startSession(items,label){
  if(!items.length)return;
  SES={queue:items.map(it=>build(it)),idx:0,label,first:new Map(),retried:new Set(),size:items.length};
  show('quiz');renderQ();
}
function startCat(c){startSession(makeSet(byCat(c),currentCount),CATMAP[c].name);}

function renderQ(){
  const q=SES.queue[SES.idx];
  const done=SES.first.size;
  $('progBar').style.width=(done/SES.size*100)+'%';
  $('progTxt').textContent=`${Math.min(done+1,SES.size)} / ${SES.size}`;
  const dirLabel=q.dir==='jpToEn'?'日本語 → 英語':'英語 → 日本語';
  let h=`<div class="qbadge"><span class="cat-tag">${esc(CATMAP[q.it.cat].name)}</span><span class="dir-tag">${dirLabel}</span></div>`;
  h+=`<div class="qins">次の${q.dir==='enToJp'?'英語':'日本語'}を${q.dir==='enToJp'?'日本語':'英語'}で答えてください</div>`;
  h+=`<div class="qword${q.dir==='enToJp'?' en':''}" id="qwordEl">${esc(q.question)}</div>`;
  if(q.dir==='enToJp'&&q.it.pos)h+=`<div class="qsub">${esc(q.it.pos)}</div>`;
  h+=`<div id="ansArea"></div>`;
  $('qcard').innerHTML=h;
  // EN→JP のとき、英語の横に読み上げボタン表示
  if(q.dir==='enToJp'){
    const wordEl=$('qwordEl');
    wordEl.appendChild(document.createTextNode(' '));
    wordEl.appendChild(makeSpeakBtn(q.it.en));
  }
  const A=$('ansArea');
  A.innerHTML=`<div class="answers">${q.opts.map((o,i)=>`<button class="opt${q.isEnOpts?' en-opt':''}" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  A.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const v=q.opts[+b.dataset.i],ok=v===q.answer;
    A.querySelectorAll('.opt').forEach(x=>{x.disabled=true;const t=q.opts[+x.dataset.i];if(t===q.answer)x.classList.add('right');else if(x===b)x.classList.add('wrong');});
    answer(ok);
  });
}
function answer(ok){
  const q=SES.queue[SES.idx],id=q.it.id;
  if(!SES.first.has(id)){SES.first.set(id,ok);record(id,ok);}
  if(!ok&&!SES.retried.has(id)){SES.retried.add(id);SES.queue.push(build(q.it,q.dir));}
  const card=$('qcard');
  const m=document.createElement('div');m.className='mark '+(ok?'ok':'ng');m.textContent=ok?'○':'✕';card.appendChild(m);
  const A=$('ansArea');
  const r=document.createElement('div');r.className='reveal';
  const exHtml=q.it.ex?`<div class="example" id="revEx">${esc(q.it.ex)}</div>`:'';
  r.innerHTML=`<div class="pair" id="revPair"><span id="revEn">${esc(q.it.en)}</span> ＝ ${esc(q.it.jp)}</div><div class="ex">${esc(q.it.pos)}</div>${exHtml}`;
  A.appendChild(r);
  // 英語単語の読み上げボタン
  const revPair=$('revPair');
  const sb=makeSpeakBtn(q.it.en);
  revPair.appendChild(document.createTextNode(' '));
  revPair.appendChild(sb);
  // 例文がある場合：例文読み上げボタンも追加
  if(q.it.ex){
    const revEx=$('revEx');
    const sbEx=makeSpeakBtn(q.it.ex);
    sbEx.title='例文を読み上げる';
    revEx.appendChild(document.createTextNode(' '));
    revEx.appendChild(sbEx);
  }
  // 自動読み上げ（英語単語）
  speak(q.it.en, sb);
  const nx=document.createElement('div');nx.className='answers';nx.style.marginTop='12px';
  const last=SES.idx>=SES.queue.length-1;
  nx.innerHTML=`<button class="act${ok?'':' red'}" id="next">${last?'結果を見る':'次へ'}</button>`;
  A.appendChild(nx);
  if(!ok&&!last)A.insertAdjacentHTML('beforeend','<p class="tip">この問題は最後にもう一度出ます</p>');
  $('next').focus({preventScroll:true});
  $('next').onclick=()=>{SES.idx++;if(SES.idx>=SES.queue.length)finish();else renderQ();};
}
function finish(){
  const total=SES.first.size,right=[...SES.first.values()].filter(Boolean).length;
  const wrongIds=[...SES.first].filter(([,v])=>!v).map(([k])=>k);
  $('resCat').textContent=SES.label;
  $('resScore').innerHTML=`${right}<small> / ${total} 問正解</small>`;
  const pct=right/total;
  $('resMsg').textContent=pct<.5?'もう少し！復習を続けよう':pct<.75?'よく頑張りました！':pct<1?'かなり正確です！':'パーフェクト！完璧です🎉';
  const wrongItems=wrongIds.map(id=>ITEMS.find(it=>it.id===id)).filter(Boolean);
  const rl=$('resList');
  if(wrongItems.length){
    $('resListTitle').textContent='まちがえた問題';
    rl.innerHTML=wrongItems.map(it=>`<div class="li"><div class="q">${esc(CATMAP[it.cat].name)}</div><div class="a">${esc(it.en)}</div><div class="pair">${esc(it.jp)}</div></div>`).join('');
    $('resRetry').disabled=false;
    $('resRetry').onclick=()=>startSession(wrongItems,'まちがえた問題');
  }else{
    $('resListTitle').textContent='';
    rl.innerHTML='<div class="empty">まちがいなし！完璧です</div>';
    $('resRetry').disabled=true;
  }
  renderHome();show('result');
}

function renderHome(){
  $('streak').textContent=(()=>{let cnt=0,d=TODAY();while(S.days.includes(d--))cnt++;return cnt;})();
  const dueItems=ITEMS.filter(it=>isDue(it.id));
  $('reviewInfo').textContent=`${dueItems.length}問`;
  $('btnReview').disabled=!dueItems.length;
  $('btnReview').onclick=()=>startSession(shuffle(dueItems).slice(0,currentCount),'復習');
  $('btnMix').onclick=()=>startSession(makeSet(ITEMS,currentCount),'おまかせ');
  const cats=$('cats');
  cats.innerHTML=CATS.map(c=>{
    const pool=byCat(c.id),total=pool.length;
    const done=pool.filter(it=>st(it.id)).length;
    const due=pool.filter(it=>isDue(it.id)).length;
    const mastered=pool.filter(it=>(st(it.id)?.box||0)>=3).length;
    return `<button class="cat" data-cat="${c.id}">
      <div class="nm">${esc(c.name)}</div>
      <div class="ds">${esc(c.desc)}</div>
      <div class="due"><b${due===0?' class="zero"':''}>${due}</b>復習</div>
      <div class="meter"><div class="track"><div class="fill" style="width:${mastered/total*100}%"></div><div class="fill2" style="width:${(done-mastered)/total*100}%"></div></div><span>${mastered}/${total}</span></div>
    </button>`;
  }).join('');
  cats.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>startCat(b.dataset.cat));
}

function renderNote(){
  const list=$('noteList');
  const wrong=ITEMS.filter(it=>(st(it.id)?.wrong||0)>0).sort((a,b)=>(st(b.id)?.wrong||0)-(st(a.id)?.wrong||0));
  if(!wrong.length){list.innerHTML='<div class="empty">まちがい記録なし</div>';$('noteStart').disabled=true;return;}
  $('noteStart').disabled=false;
  $('noteStart').onclick=()=>startSession(shuffle(wrong).slice(0,currentCount),'まちがいノート');
  list.innerHTML=wrong.map(it=>`<div class="li"><div class="q">${esc(CATMAP[it.cat].name)} · <span style="color:var(--red)">${st(it.id).wrong}回まちがい</span></div><div class="a">${esc(it.en)}</div><div class="pair">${esc(it.jp)}</div></div>`).join('');
}

function renderRec(){
  $('stTotal').textContent=S.total;
  $('stRate').textContent=S.total?Math.round(S.correct/S.total*100)+'%':'-';
  $('stDays').textContent=S.days.length;
  const tbl=$('recTbl');
  const rows=CATS.map(c=>{
    const pool=byCat(c.id),done=pool.filter(it=>st(it.id)).length;
    const m=pool.filter(it=>(st(it.id)?.box||0)>=3).length;
    const r=pool.filter(it=>isDue(it.id)).length;
    return `<tr><td>${esc(c.name)}</td><td>${m}/${pool.length}</td><td>${done}</td><td>${r}</td></tr>`;
  });
  tbl.innerHTML=`<thead><tr><th>カテゴリ</th><th>習得</th><th>学習済</th><th>要復習</th></tr></thead><tbody>${rows.join('')}</tbody>`;
  const th=localStorage.getItem('eigodojo-theme')||'auto';
  $('themeChips').querySelectorAll('.chip').forEach(c=>{
    c.setAttribute('aria-pressed',c.dataset.t===th?'true':'false');
    c.onclick=()=>{const t=c.dataset.t;localStorage.setItem('eigodojo-theme',t);applyTheme(t);$('themeChips').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x.dataset.t===t?'true':'false'));};
  });
  $('resetBtn').onclick=()=>{$('resetConfirm').hidden=false;};
  $('resetNo').onclick=()=>{$('resetConfirm').hidden=true;};
  $('resetYes').onclick=()=>{S={items:{},days:[],total:0,correct:0};save();$('resetConfirm').hidden=true;renderRec();renderHome();};
}
function applyTheme(t){if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);}
applyTheme(localStorage.getItem('eigodojo-theme')||'auto');

const PAGES=['home','quiz','result','note','rec'];
function show(id){PAGES.forEach(p=>{const el=$(p);if(el)el.hidden=p!==id;});}
$('nav').querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{
  const go=b.dataset.go;
  $('nav').querySelectorAll('[data-go]').forEach(x=>x.removeAttribute('aria-current'));
  b.setAttribute('aria-current','page');
  if(go==='note')renderNote();
  if(go==='rec')renderRec();
  show(go);
}));
$('quit').onclick=()=>{show('home');renderHome();};
$('resHome').onclick=()=>{show('home');renderHome();};
$('modeToggle').querySelectorAll('.toggle-btn').forEach(b=>b.onclick=()=>{
  $('modeToggle').querySelectorAll('.toggle-btn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');currentMode=b.dataset.mode;
});
$('countToggle').querySelectorAll('.toggle-btn').forEach(b=>b.onclick=()=>{
  $('countToggle').querySelectorAll('.toggle-btn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');currentCount=+b.dataset.count;
});
renderHome();
</script>
