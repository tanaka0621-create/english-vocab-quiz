<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>英語フレーズ3000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f0f4ff;--card:#fff;--ink:#1a202c;--muted:#6b7280;--line:#e5e7eb;
  --blue:#2563eb;--blue-s:#dbeafe;--green:#059669;--green-s:#d1fae5;
  --red:#dc2626;--red-s:#fee2e2;--shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--muted:#94a3b8;--line:#334155;
  --blue:#60a5fa;--blue-s:#1e3a5f;--green:#34d399;--green-s:#064e3b;
  --red:#f87171;--red-s:#450a0a;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',system-ui,sans-serif;
  font-size:16px;line-height:1.6;min-height:100dvh;-webkit-tap-highlight-color:transparent;
  padding-bottom:env(safe-area-inset-bottom,0)}
button{font-family:inherit;cursor:pointer;border:none}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
select{font-family:inherit}
.wrap{max-width:540px;margin:0 auto;padding:16px 16px 100px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 0 18px}
.hdr-logo{font-size:19px;font-weight:700}
.hdr-logo small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.hdr-streak{text-align:right;font-size:12px;color:var(--muted)}
.hdr-streak b{font-size:22px;color:var(--blue);display:block;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--card);border-radius:12px;padding:12px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.sec-ttl{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-bottom:8px}
.rand-btn{width:100%;background:var(--blue);color:#fff;border-radius:16px;padding:16px;
  font-size:17px;font-weight:700;box-shadow:var(--shadow);margin-bottom:16px;text-align:left}
.rand-btn span{font-size:12px;font-weight:400;opacity:.85;display:block;margin-top:2px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.cat-btn{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 12px;text-align:left;box-shadow:var(--shadow);display:flex;
  flex-direction:column;gap:3px;position:relative;overflow:hidden}
.cat-btn .emo{font-size:22px;line-height:1}
.cat-btn .nm{font-weight:700;font-size:14px;margin-top:4px;line-height:1.3}
.cat-btn .sub{font-size:10px;color:var(--muted)}
.cat-btn .cnt{font-size:11px;color:var(--blue);font-weight:700}
.cat-btn .pbar{position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--line)}
.cat-btn .pfill{height:100%;background:var(--blue);transition:width .3s}
.qhdr{display:flex;align-items:center;gap:10px;padding-bottom:14px}
.qback{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px}
.qprog{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.qprog div{height:100%;background:var(--blue);transition:width .3s}
.qnum{font-size:13px;color:var(--muted);min-width:3.5em;text-align:right;font-variant-numeric:tabular-nums}
.qcard{background:var(--card);border-radius:20px;box-shadow:var(--shadow);
  padding:24px 20px;border:1px solid var(--line);margin-bottom:16px}
.qtag{display:inline-block;background:var(--blue-s);color:var(--blue);
  font-size:12px;font-weight:700;border-radius:999px;padding:3px 12px;margin-bottom:14px}
.qhint{font-size:13px;color:var(--muted);margin-bottom:10px}
.qjp{font-size:24px;font-weight:700;line-height:1.65;letter-spacing:.02em}
.speak-btn{width:100%;background:var(--blue);color:#fff;border-radius:16px;
  padding:16px;font-size:17px;font-weight:700;display:flex;align-items:center;
  justify-content:center;gap:10px;margin-bottom:10px}
.speak-btn.on{background:var(--green)}
.reveal{background:var(--blue-s);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.reveal .en{font-size:20px;font-weight:700;color:var(--blue);line-height:1.5}
.rating{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-k{background:var(--green);color:#fff;border-radius:14px;padding:14px;font-size:16px;font-weight:700}
.btn-f{background:var(--card);color:var(--ink);border-radius:14px;padding:14px;font-size:16px;font-weight:700;border:2px solid var(--line)}
.res-score{text-align:center;padding:24px 0 20px}
.res-big{font-size:56px;font-weight:700;color:var(--blue);line-height:1}
.res-big small{font-size:20px;color:var(--muted)}
.res-msg{font-size:15px;color:var(--muted);margin-top:8px}
.btn-row{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.btn-p{background:var(--blue);color:#fff;border-radius:14px;padding:14px;font-size:16px;font-weight:700;width:100%}
.btn-g{background:var(--card);color:var(--ink);border-radius:14px;padding:14px;font-size:16px;font-weight:700;border:2px solid var(--line);width:100%}
.miss-list{display:flex;flex-direction:column;gap:8px}
.miss-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.miss-item .jp{font-size:15px;font-weight:700}
.miss-item .en{font-size:14px;color:var(--blue);margin-top:2px}
.miss-item .speak-sm{background:var(--blue-s);color:var(--blue);border:none;border-radius:8px;padding:5px 8px;font-size:16px;float:right;margin-left:8px;cursor:pointer}
.rev-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rev-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.rev-item .content{flex:1}
.rev-item .jp{font-size:15px;font-weight:700}
.rev-item .en{font-size:13px;color:var(--muted);margin-top:2px}
.rev-item .sp{background:var(--blue-s);color:var(--blue);border:none;border-radius:8px;padding:8px 10px;font-size:18px;flex-shrink:0;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.set-row{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.set-row .lbl{font-size:15px;font-weight:500}
.set-row .sub{font-size:12px;color:var(--muted)}
.set-row select{font-size:14px;padding:6px 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);color:var(--ink)}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--card);
  border-top:1px solid var(--line);display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,0);z-index:10}
.bnav-in{display:flex;max-width:540px;width:100%}
.bnav button{flex:1;background:none;padding:10px 4px 12px;font-size:11px;
  color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.bnav button .ic{font-size:20px;line-height:1.1}
.bnav button[aria-current="page"]{color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
<section id="sec-home">
  <header class="hdr">
    <div class="hdr-logo">英語フレーズ3000<small>日常会話マスター</small></div>
    <div class="hdr-streak">連続<b id="streakNum">0</b>日</div>
  </header>
  <div class="stats">
    <div class="stat"><b id="stTotal">0</b><span>学習済み</span></div>
    <div class="stat"><b id="stRate">-</b><span>正解率</span></div>
    <div class="stat"><b id="stMaster">0</b><span>マスター</span></div>
  </div>
  <button class="rand-btn" id="btnRand">🎲 ランダム練習<span>全カテゴリからシャッフル（20問）</span></button>
  <div class="sec-ttl">カテゴリをえらぶ</div>
  <div class="cat-grid" id="catGrid"></div>
</section>

<section id="sec-quiz" hidden>
  <div class="qhdr">
    <button class="qback" id="quizBack">← やめる</button>
    <div class="qprog"><div id="qBar"></div></div>
    <div class="qnum" id="qNum"></div>
  </div>
  <div class="qcard">
    <div class="qtag" id="qTag"></div>
    <div class="qhint">日本語を見て、英語で言ってみよう</div>
    <div class="qjp" id="qJp"></div>
  </div>
  <button class="speak-btn" id="speakBtn"><span class="ic">🔊</span> 答えを聞く</button>
  <div id="revealBox" class="reveal" hidden><div class="en" id="qEn"></div></div>
  <div class="rating" id="ratingRow" hidden>
    <button class="btn-k" id="btnKnew">✓ 知ってた</button>
    <button class="btn-f" id="btnForgot">✗ 知らなかった</button>
  </div>
</section>

<section id="sec-result" hidden>
  <div class="res-score">
    <div class="res-big" id="resBig"></div>
    <div class="res-msg" id="resMsg"></div>
  </div>
  <div class="btn-row">
    <button class="btn-p" id="resRetry">間違えた問題をもう一度</button>
    <button class="btn-g" id="resHome">ホームへ戻る</button>
  </div>
  <div class="sec-ttl" id="missTitle">間違えたフレーズ</div>
  <div class="miss-list" id="missList"></div>
</section>

<section id="sec-review" hidden>
  <header class="hdr"><div class="hdr-logo">復習リスト<small>もう一度確認しよう</small></div></header>
  <button class="btn-p" id="reviewStart" style="margin-bottom:12px">この中から練習する（20問）</button>
  <div class="rev-list" id="revList"></div>
  <div class="empty" id="revEmpty"><div style="font-size:48px;margin-bottom:12px">📚</div>復習リストは空です</div>
</section>

<section id="sec-settings" hidden>
  <header class="hdr"><div class="hdr-logo">設定<small>Settings</small></div></header>
  <div class="set-row">
    <div><div class="lbl">話す速度</div><div class="sub">英語の読み上げ速度</div></div>
    <select id="rateSelect">
      <option value="0.7">ゆっくり</option>
      <option value="0.9" selected>ふつう</option>
      <option value="1.1">はやめ</option>
      <option value="1.3">はやい</option>
    </select>
  </div>
  <div class="set-row">
    <div><div class="lbl">総フレーズ数</div><div class="sub">登録されているフレーズ</div></div>
    <b id="totalCount" style="color:var(--blue)">-</b>
  </div>
  <div style="margin-top:16px">
    <button class="btn-g" id="resetBtn">学習記録をリセットする</button>
    <div id="resetConf" hidden style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button class="btn-p" id="resetYes" style="background:var(--red)">本当に消す</button>
      <button class="btn-g" id="resetNo">やめる</button>
    </div>
  </div>
</section>
</div>

<nav class="bnav">
  <div class="bnav-in">
    <button data-sec="home" aria-current="page"><span class="ic">🏠</span>ホーム</button>
    <button data-sec="review"><span class="ic">📋</span>復習</button>
    <button data-sec="settings"><span class="ic">⚙️</span>設定</button>
  </div>
</nav>

const PHRASES={};
let totalPhrases=0;
for(const[k,v]of Object.entries(RAW)){
  PHRASES[k]=v.trim().split('\n').map(l=>{const p=l.indexOf('|');return[l.slice(0,p),l.slice(p+1)];});
  totalPhrases+=PHRASES[k].length;
}

const SK='ep3k_v2';
let S=JSON.parse(localStorage.getItem(SK)||'null')||{seen:{},miss:[],days:[],rate:'0.9'};
const save=()=>localStorage.setItem(SK,JSON.stringify(S));
const pid=(c,i)=>c+'_'+i;
const today=()=>new Date().toISOString().slice(0,10);

function markSeen(c,i,knew){
  const id=pid(c,i);
  if(!S.seen[id])S.seen[id]={k:0,f:0};
  if(knew)S.seen[id].k++;else S.seen[id].f++;
  if(!knew){
    const ph=PHRASES[c][i];
    if(!S.miss.find(m=>m.c===c&&m.i===i))S.miss.push({c,i,jp:ph[0],en:ph[1]});
  }
  const t=today();
  if(!S.days.includes(t))S.days.push(t);
  save();
}

function streak(){
  const days=[...S.days].sort();
  if(!days.length)return 0;
  let n=0,d=new Date();
  while(true){const s=d.toISOString().slice(0,10);if(days.includes(s)){n++;d.setDate(d.getDate()-1);}else break;}
  return n;
}
function totalSeen(){return Object.keys(S.seen).length;}
function totalKnown(){return Object.values(S.seen).filter(s=>s.k>0&&s.f===0).length;}
function overallRate(){let k=0,f=0;for(const s of Object.values(S.seen)){k+=s.k;f+=s.f;}const t=k+f;return t>0?Math.round(k/t*100)+'%':'-';}
function catProg(c){const ph=PHRASES[c];if(!ph)return 0;const d=ph.filter((_,i)=>S.seen[pid(c,i)]).length;return Math.round(d/ph.length*100);}

let voices=[];
speechSynthesis.onvoiceschanged=()=>{voices=speechSynthesis.getVoices();};
setTimeout(()=>{voices=speechSynthesis.getVoices();},600);

function speak(text){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';
  u.rate=parseFloat(S.rate||0.9);
  const eng=voices.filter(v=>v.lang.startsWith('en'));
  if(eng.length){const m=eng.find(v=>/samantha|zoe|karen|moira|victoria|ava|female|woman/i.test(v.name))||eng[0];if(m)u.voice=m;}
  const btn=document.getElementById('speakBtn');
  if(btn){btn.classList.add('on');btn.innerHTML='<span class="ic">🔉</span> 再生中...';}
  u.onend=u.onerror=()=>{if(btn){btn.classList.remove('on');btn.innerHTML='<span class="ic">🔊</span> 答えを聞く';}showReveal();};
  speechSynthesis.speak(u);
}

let quiz={items:[],cur:0,known:0,forgot:0,missed:[]};

function buildQuiz(catId){
  let items;
  if(catId==='_random'){
    const all=[];for(const[c,ps]of Object.entries(PHRASES))ps.forEach((_,i)=>all.push({c,i}));
    items=shuffle(all).slice(0,20);
  }else{
    items=PHRASES[catId].map((_,i)=>({c:catId,i}));
    items=shuffle(items).slice(0,20);
  }
  quiz={items,cur:0,known:0,forgot:0,missed:[],catId};
}
function buildMissedQuiz(){
  quiz={items:shuffle(S.miss.map(m=>({c:m.c,i:m.i}))).slice(0,20),cur:0,known:0,forgot:0,missed:[],catId:'_miss'};
}
function shuffle(a){return[...a].sort(()=>Math.random()-.5);}
function curPh(){const{c,i}=quiz.items[quiz.cur];return{c,i,jp:PHRASES[c][i][0],en:PHRASES[c][i][1]};}

function showReveal(){
  const ph=curPh();
  document.getElementById('qEn').textContent=ph.en;
  document.getElementById('revealBox').hidden=false;
  document.getElementById('ratingRow').hidden=false;
}
function advance(knew){
  const{c,i}=quiz.items[quiz.cur];
  markSeen(c,i,knew);
  if(knew)quiz.known++;else{quiz.forgot++;quiz.missed.push(quiz.items[quiz.cur]);}
  quiz.cur++;
  if(quiz.cur>=quiz.items.length)showResult();else showQuestion();
}
function showQuestion(){
  const ph=curPh();
  const pct=Math.round(quiz.cur/quiz.items.length*100);
  document.getElementById('qBar').style.width=pct+'%';
  document.getElementById('qNum').textContent=(quiz.cur+1)+'/'+quiz.items.length;
  document.getElementById('qTag').textContent=CATS.find(c=>c.id===ph.c)?.name||'';
  document.getElementById('qJp').textContent=ph.jp;
  document.getElementById('revealBox').hidden=true;
  document.getElementById('ratingRow').hidden=true;
  const btn=document.getElementById('speakBtn');
  btn.classList.remove('on');
  btn.innerHTML='<span class="ic">🔊</span> 答えを聞く';
}
function showResult(){
  const tot=quiz.items.length,pct=Math.round(quiz.known/tot*100);
  document.getElementById('resBig').innerHTML=pct+'<small>%</small>';
  document.getElementById('resMsg').textContent=pct>=90?'素晴らしい！完璧に近いです！':pct>=70?'よくできました！':pct>=50?'もう少し！続けて練習しましょう。':'復習が必要です。もう一度練習しましょう。';
  const ml=document.getElementById('missList'),mt=document.getElementById('missTitle');
  ml.innerHTML='';
  if(quiz.missed.length){mt.hidden=false;quiz.missed.forEach(({c,i})=>{const ph=PHRASES[c][i];const d=document.createElement('div');d.className='miss-item';d.innerHTML=`<button class="speak-sm" onclick="speak(${JSON.stringify(ph[1])})">🔊</button><div class="jp">${ph[0]}</div><div class="en">${ph[1]}</div>`;ml.appendChild(d);});}else{mt.hidden=true;}
  document.getElementById('resRetry').disabled=quiz.missed.length===0;
  showSec('result');
}

function showSec(id){
  ['home','quiz','result','review','settings'].forEach(s=>document.getElementById('sec-'+s).hidden=s!==id);
  document.querySelectorAll('.bnav button').forEach(b=>b.setAttribute('aria-current',b.dataset.sec===id?'page':'false'));
  if(id==='home')updateHome();
  if(id==='review')updateReview();
}

function updateHome(){
  document.getElementById('streakNum').textContent=streak();
  document.getElementById('stTotal').textContent=totalSeen();
  document.getElementById('stRate').textContent=overallRate();
  document.getElementById('stMaster').textContent=totalKnown();
  const grid=document.getElementById('catGrid');
  grid.innerHTML='';
  CATS.forEach(cat=>{
    const prog=catProg(cat.id),count=PHRASES[cat.id]?.length||0;
    const btn=document.createElement('button');
    btn.className='cat-btn';
    btn.innerHTML=`<div class="emo">${cat.emoji}</div><div class="nm">${cat.name}</div><div class="sub">${cat.en}</div><div class="cnt">${count}フレーズ</div><div class="pbar"><div class="pfill" style="width:${prog}%"></div></div>`;
    btn.onclick=()=>startQuiz(cat.id);
    grid.appendChild(btn);
  });
}

function updateReview(){
  const list=document.getElementById('revList'),empty=document.getElementById('revEmpty');
  list.innerHTML='';
  if(!S.miss.length){empty.hidden=false;return;}
  empty.hidden=true;
  S.miss.forEach(m=>{
    const d=document.createElement('div');d.className='rev-item';
    d.innerHTML=`<div class="content"><div class="jp">${m.jp}</div><div class="en">${m.en}</div></div><button class="sp" onclick="speak(${JSON.stringify(m.en)})">🔊</button>`;
    list.appendChild(d);
  });
}

function startQuiz(catId){buildQuiz(catId);showSec('quiz');showQuestion();}

document.getElementById('btnRand').onclick=()=>startQuiz('_random');
document.getElementById('speakBtn').onclick=()=>{const ph=curPh();speak(ph.en);};
document.getElementById('btnKnew').onclick=()=>advance(true);
document.getElementById('btnForgot').onclick=()=>advance(false);
document.getElementById('quizBack').onclick=()=>showSec('home');
document.getElementById('resHome').onclick=()=>showSec('home');
document.getElementById('resRetry').onclick=()=>{quiz.items=quiz.missed;quiz.cur=0;quiz.known=0;quiz.forgot=0;quiz.missed=[];if(quiz.items.length){showSec('quiz');showQuestion();}};
document.getElementById('reviewStart').onclick=()=>{buildMissedQuiz();showSec('quiz');showQuestion();};
document.querySelectorAll('.bnav button').forEach(b=>b.onclick=()=>showSec(b.dataset.sec));
document.getElementById('rateSelect').onchange=e=>{S.rate=e.target.value;save();};
document.getElementById('totalCount').textContent=totalPhrases+'フレーズ';
document.getElementById('resetBtn').onclick=()=>document.getElementById('resetConf').hidden=false;
document.getElementById('resetNo').onclick=()=>document.getElementById('resetConf').hidden=true;
document.getElementById('resetYes').onclick=()=>{localStorage.removeItem(SK);location.reload();};
document.getElementById('rateSelect').value=S.rate||'0.9';
updateHome();
</script>
